[project]
name = "transcriber"
version = "0.1.0"
description = "Audio to timestamped text: any format, any length."
requires-python = ">=3.10"
dependencies = [
    "onnx-asr[cpu,hub]>=0.12",  # Parakeet on ONNX Runtime, plus Silero VAD
    "faster-whisper>=1.1",  # the Whisper engine; also brings PyAV (bundled FFmpeg)
    "numpy",
    "fastapi>=0.110",
    "uvicorn",
    "python-multipart",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transcriber"]  # tests/ and samples/ sit beside it and are not part of the package

[tool.setuptools.package-data]
transcriber = ["static/*"]  # the upload page

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
